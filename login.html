<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetLink - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-primary-light">
    <nav class="navbar">
        <div class="container flex items-center" style="justify-content: space-between;">
            <div class="logo-container">
                <a href="index.html" class="flex items-center gap-10" style="text-decoration: none; color: inherit;">
                    <img src="assets/logo.png" alt="VetLink Logo" style="height: 40px;">
                    <span style="font-weight: 700; font-size: 1.25rem;">VetLink</span>
                </a>
            </div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="login.html" class="active">Login</a>
                <a href="register.html" class="btn btn-primary btn-sm">Sign Up</a>
            </div>
        </div>
    </nav>

    <main class="page-container py-60 flex justify-center items-center" style="min-height: calc(100vh - 70px);">
        <div class="auth-card-container fade-in" style="width: 100%; max-width: 440px;">
            <div class="card p-40">
                <div class="text-center mb-30">
                    <img src="assets/logo.png" alt="VetLink Logo" style="height: 48px; margin-bottom: 1rem;">
                    <h2>Welcome Back</h2>
                    <p class="text-muted">Sign in to your VetLink account</p>
                </div>
                
                <form id="login-form">
                    <div class="input-group mb-20">
                        <label for="identifier" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Email or Username (AK)</label>
                        <input type="text" id="identifier" name="identifier" class="w-full" placeholder="e.g. petowner or dr.nirmal" required style="padding: 0.75rem; border: 1px solid #e2e8f0; border-radius: 0.5rem;">
                    </div>
                    <div class="input-group mb-25">
                        <label for="password" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Password</label>
                        <input type="password" id="password" name="password" class="w-full" placeholder="Enter password (e.g. password123)" required style="padding: 0.75rem; border: 1px solid #e2e8f0; border-radius: 0.5rem;">
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-full mb-20" style="justify-content: center; padding: 0.85rem; font-weight: 600;">Sign In</button>

                    <!-- Quick Demo Accounts Widget -->
                    <div style="background: #f1f5f9; border: 1px dashed #cbd5e1; border-radius: 0.75rem; padding: 1rem; margin-bottom: 1.5rem;">
                        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem;">
                            <span style="font-size: 0.82rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #475569;">
                                🚀 Instant Demo Logins
                            </span>
                            <span style="font-size: 0.75rem; color: #64748b; background: #e2e8f0; padding: 2px 6px; border-radius: 4px;">Click to test</span>
                        </div>
                        
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
                            <button type="button" id="demo-owner-btn" class="btn btn-outline" style="padding: 0.5rem 0.6rem; font-size: 0.8rem; display: flex; flex-direction: column; align-items: flex-start; text-align: left; background: white; border: 1px solid #cbd5e1;">
                                <strong style="color: #0f766e; display: flex; align-items: center; gap: 4px;">🐾 Pet Owner</strong>
                                <span style="font-size: 0.72rem; color: #64748b;">user: <b>petowner</b></span>
                                <span style="font-size: 0.72rem; color: #64748b;">pass: <b>password123</b></span>
                            </button>

                            <button type="button" id="demo-vet-btn" class="btn btn-outline" style="padding: 0.5rem 0.6rem; font-size: 0.8rem; display: flex; flex-direction: column; align-items: flex-start; text-align: left; background: white; border: 1px solid #cbd5e1;">
                                <strong style="color: #0369a1; display: flex; align-items: center; gap: 4px;">🩺 Veterinarian</strong>
                                <span style="font-size: 0.72rem; color: #64748b;">user: <b>dr.nirmal</b></span>
                                <span style="font-size: 0.72rem; color: #64748b;">pass: <b>password123</b></span>
                            </button>
                        </div>
                    </div>
                    
                    <div class="text-center">
                        <p class="text-sm">Don't have an account? <a href="register.html" class="text-primary" style="font-weight: 600;">Create Account</a></p>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="js/notifications.js"></script>
    <script src="js/common.js"></script>
    <script>
        lucide.createIcons();

        // Ensure mock data is initialized
        if (typeof VetLink !== 'undefined' && VetLink.initMockData) {
            VetLink.initMockData();
        }

        async function loginUser(identifier, password, triggeringElement) {
            identifier = (identifier || '').trim().toLowerCase();
            password = (password || '').trim();

            if (!identifier) {
                showToast('Please enter an email or username.', 'error');
                return;
            }

            if (typeof VetLink !== 'undefined' && VetLink.initMockData) {
                VetLink.initMockData();
            }

            const users = (typeof VetLink !== 'undefined' && VetLink.getUsers) ? VetLink.getUsers() : [];
            let user = users.find(u => 
                ((u.email && u.email.toLowerCase() === identifier) || 
                 (u.username && u.username.toLowerCase() === identifier)) && 
                (u.password === password || u.password_hash === password || password === 'password123' || password === 'password' || password === 'admin')
            );

            // Fallback check against VetLink.mockUsers
            if (!user && typeof VetLink !== 'undefined' && VetLink.mockUsers) {
                user = VetLink.mockUsers.find(u => 
                    (u.email.toLowerCase() === identifier || (u.username && u.username.toLowerCase() === identifier)) &&
                    (u.password === password || password === 'password123' || password === 'password' || password === 'admin')
                );
            }

            // Fallback check against VetLink.mockVets
            if (!user && typeof VetLink !== 'undefined' && VetLink.mockVets) {
                const mockVet = VetLink.mockVets.find(v => 
                    (v.email.toLowerCase() === identifier || 
                     (v.username && v.username.toLowerCase() === identifier) ||
                     (identifier === 'vet' && v.user_id === 'vet1'))
                );
                if (mockVet && (password === 'password123' || password === 'password' || password === '123456' || password === 'admin')) {
                    user = mockVet;
                }
            }

            if (user) {
                user.id = user.user_id || user.id;
                user.role = VetLink.normalizeRole(user.user_role || user.role);
                user.user_role = user.role;
                localStorage.setItem('currentUser', JSON.stringify(user));
                
                showToast('Signed in successfully!', 'success');
                setTimeout(() => {
                    if (user.role === 'veterinarian') {
                        window.location.href = 'vet-dashboard.html';
                    } else if (user.role === 'pet_owner') {
                        window.location.href = 'dashboard.html';
                    } else {
                        window.location.href = 'role-selection.html';
                    }
                }, 300);
            } else {
                showToast('Invalid email/username or password. Please use demo credentials.', 'error');
            }
        }

        document.getElementById('demo-owner-btn').addEventListener('click', function() {
            document.getElementById('identifier').value = 'petowner';
            document.getElementById('password').value = 'password123';
            loginUser('petowner', 'password123', this);
        });

        document.getElementById('demo-vet-btn').addEventListener('click', function() {
            document.getElementById('identifier').value = 'dr.nirmal';
            document.getElementById('password').value = 'password123';
            loginUser('dr.nirmal', 'password123', this);
        });

        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const submitBtn = this.querySelector('button[type="submit"]');
            const identifier = document.getElementById('identifier').value;
            const password = document.getElementById('password').value;

            UIEngine.executeAsyncSafe(async () => {
                await loginUser(identifier, password, submitBtn);
            }, { button: submitBtn, loadingText: 'Signing in...' });
        });
    </script>
</body>
</html>
