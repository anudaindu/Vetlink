<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Pets - VetLink</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="dashboard-container">

        <aside class="dashboard-sidebar">
            <div class="sidebar-header">
                <div class="logo-container">
                    <img src="assets/logo.png" alt="VetLink Logo" class="logo-img" style="height: 40px;">
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i data-lucide="layout-dashboard"></i><span>Dashboard</span>
                </a>
                <a href="my-pets.html" class="nav-item active">
                    <i data-lucide="dog"></i><span>My Pets</span>
                </a>
                <a href="register-pet.html" class="nav-item">
                    <i data-lucide="plus-circle"></i><span>Register Pet</span>
                </a>
                <a href="find-vet.html" class="nav-item">
                    <i data-lucide="search"></i><span>Find Vet</span>
                </a>
                <a href="book-vet.html" class="nav-item">
                    <i data-lucide="calendar-plus"></i><span>Book Vet</span>
                </a>
                <a href="account.html" class="nav-item">
                    <i data-lucide="user"></i><span>Account</span>
                </a>
                <a href="#" class="nav-item text-danger" id="logout-btn">
                    <i data-lucide="log-out"></i><span>Logout</span>
                </a>
            </nav>
        </aside>

        <main class="dashboard-main">

            <header class="dashboard-top-nav">
                <div class="mobile-menu-toggle" id="mobile-menu-btn">
                    <i data-lucide="menu"></i>
                </div>
                <div class="top-nav-right">
                    <div class="user-info">
                        <span id="user-name-display">User</span>
                        <div class="avatar-sm" id="user-avatar-display">U</div>
                    </div>
                </div>
            </header>

            <div class="dashboard-content fade-in">

                <div class="page-header flex items-center mb-20" style="justify-content: space-between;">
                    <div>
                        <h1 style="margin: 0 0 5px;">My Pets</h1>
                        <p class="text-muted" style="margin: 0;">Registered pets under your owner profile (1..m relationship)</p>
                    </div>
                    <a href="register-pet.html" class="btn btn-primary flex items-center gap-5">
                        <i data-lucide="plus" style="width: 18px; height: 18px;"></i> Register New Pet
                    </a>
                </div>
                
                <div id="pets-grid" class="pets-grid grid-3 gap-20">
                    <!-- JS populates -->
                </div>

            </div>
        </main>
    </div>

    <script src="js/notifications.js"></script>
    <script src="js/common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!VetLink.requireAuth()) return;
            if (!VetLink.requireRole('pet_owner')) return;

            const currentUser = VetLink.getCurrentUser();
            const currentUserId = currentUser.user_id || currentUser.id;
            const allPets = VetLink.getPets() || [];
            
            // Filter by ownerId or show all if newly created demo user
            let userPets = allPets.filter(p => p.owner_id === currentUserId || p.ownerId === currentUserId);
            if (userPets.length === 0 && (!currentUser.user_id || currentUser.email === 'john@example.com' || allPets.length > 0)) {
                // For demonstration if ownerId is unlinked
                userPets = allPets;
            }

            const grid = document.getElementById('pets-grid');
            
            if (userPets.length === 0) {
                grid.innerHTML = `
                    <div class="card text-center col-span-full py-40">
                        <i data-lucide="dog" style="width:48px;height:48px;margin:0 auto 15px; color: #94a3b8;"></i>
                        <h3 class="mb-10">No pets registered yet</h3>
                        <p class="text-muted mb-20">Add your first pet to start maintaining digital vaccination records.</p>
                        <a href="register-pet.html" class="btn btn-primary">Register Your First Pet</a>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            let html = '';
            userPets.forEach(pet => {
                const petId = pet.pet_id || pet.id;
                const species = pet.species || pet.type || 'Pet';
                const gender = pet.gender || 'Not specified';
                const breed = pet.breed || 'Unknown breed';
                const ageStr = VetLink.calculateAge(pet.date_of_birth || pet.dob);
                const recordsCount = (pet.vaccination_records || pet.vaccinations || []).length;
                const iconName = species.toLowerCase() === 'cat' ? 'cat' : (species.toLowerCase() === 'bird' ? 'feather' : 'dog');

                html += `
                    <div class="card feature-card" style="display: flex; flex-direction: column; justify-content: space-between; position: relative;">
                        <div style="position: absolute; top: 15px; right: 15px;">
                            <span class="status-badge" style="background: #e2e8f0; color: #334155; font-size: 0.75rem;">${petId}</span>
                        </div>
                        
                        <div>
                            <div class="avatar-sm mb-15" style="width:64px;height:64px;border-radius:50%;background:#eff6ff;color:var(--primary-color);display:flex;align-items:center;justify-content:center;margin: 0 auto 15px;">
                                <i data-lucide="${iconName}" style="width: 32px; height: 32px;"></i>
                            </div>
                            <h3 class="text-center mb-5" style="font-size: 1.3rem;">${pet.name}</h3>
                            <p class="text-center text-sm text-muted mb-15">${species} • ${breed}</p>
                            
                            <div style="background: #f8fafc; border-radius: 8px; padding: 12px; margin-bottom: 15px; font-size: 0.85rem; display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                                <div><strong style="color: #64748b;">Species:</strong> ${species}</div>
                                <div><strong style="color: #64748b;">Gender:</strong> ${gender}</div>
                                <div><strong style="color: #64748b;">Age:</strong> ${ageStr}</div>
                                <div><strong style="color: #64748b;">Vaccines:</strong> ${recordsCount} record${recordsCount === 1 ? '' : 's'}</div>
                            </div>
                        </div>

                        <div class="flex gap-10">
                            <a href="pet-details.html?id=${petId}" class="btn btn-outline btn-sm w-full" style="justify-content: center;">
                                <i data-lucide="file-text" style="width: 14px; height: 14px; margin-right: 4px;"></i> Vaccination Book
                            </a>
                            <a href="book-vet.html?petId=${petId}" class="btn btn-primary btn-sm" title="Book Appointment">
                                <i data-lucide="calendar" style="width: 14px; height: 14px;"></i>
                            </a>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
            lucide.createIcons();
        });
    </script>
</body>
</html>
