<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incoming Requests - VetLink</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="dashboard-container">
        <aside class="dashboard-sidebar">
            <div class="sidebar-header">
                <div class="logo-container">
                    <img src="assets/logo.png" alt="VetLink Logo" class="logo-img" style="height: 40px;">
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="vet-dashboard.html" class="nav-item">
                    <i data-lucide="layout-dashboard"></i><span>Dashboard</span>
                </a>
                <a href="vet-requests.html" class="nav-item active">
                    <i data-lucide="bell"></i><span>Incoming Requests</span>
                </a>
                <a href="vet-patients.html" class="nav-item">
                    <i data-lucide="users"></i><span>My Patients</span>
                </a>
                <a href="vet-schedule.html" class="nav-item">
                    <i data-lucide="calendar"></i><span>Schedule</span>
                </a>
                <a href="vet-settings.html" class="nav-item">
                    <i data-lucide="settings"></i><span>Settings</span>
                </a>
                <a href="vet-profile.html" class="nav-item">
                    <i data-lucide="user-cog"></i><span>Profile</span>
                </a>
                <a href="#" class="nav-item text-danger" id="logout-btn">
                    <i data-lucide="log-out"></i><span>Logout</span>
                </a>
            </nav>
        </aside>
        <main class="dashboard-main">
            <header class="dashboard-top-nav">
                <div class="mobile-menu-toggle" id="mobile-menu-btn">
                    <i data-lucide="menu"></i>
                </div>
                <div class="top-nav-right">
                    <div class="user-info">
                        <span id="user-name-display">Dr. Name</span>
                        <div class="avatar-sm" id="user-avatar-display">D</div>
                    </div>
                </div>
            </header>
            <div class="dashboard-content fade-in">
                <h1 class="page-header mb-20">Incoming Requests</h1>
                
                <div class="tabs mb-20" style="display:flex; gap:10px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">
                    <button class="tab-btn active btn btn-outline" data-tab="pending">Pending</button>
                    <button class="tab-btn btn btn-outline" data-tab="approved">Approved</button>
                    <button class="tab-btn btn btn-outline" data-tab="rejected">Rejected/Past</button>
                </div>

                <div id="requests-list" class="grid-2 gap-15">
                    <!-- Populated by JS -->
                </div>
            </div>
        </main>
    </div>

    <script src="js/notifications.js"></script>
    <script src="js/common.js"></script>
    <script>
        let currentTab = 'pending';

        document.addEventListener('DOMContentLoaded', () => {
            if (!VetLink.requireAuth() || !VetLink.requireRole('veterinarian')) return;
            lucide.createIcons();

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active', 'btn-primary'));
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.add('btn-outline'));
                    
                    e.target.classList.add('active', 'btn-primary');
                    e.target.classList.remove('btn-outline');
                    
                    currentTab = e.target.getAttribute('data-tab');
                    renderRequests();
                });
            });

            // Initialize active tab style
            const activeBtn = document.querySelector('.tab-btn.active');
            activeBtn.classList.remove('btn-outline');
            activeBtn.classList.add('btn-primary');

            renderRequests();
        });

        function renderRequests() {
            const bookings = VetLink.getBookings();
            const user = VetLink.getCurrentUser();
            const myBookings = bookings.filter(b => b.vetId === user.id);
            
            const filtered = myBookings.filter(b => {
                if (currentTab === 'rejected') return b.status === 'rejected' || b.status === 'past';
                return b.status === currentTab;
            }).reverse();

            const container = document.getElementById('requests-list');
            
            if (filtered.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-40 text-muted">No ${currentTab} requests found.</div>`;
                return;
            }

            container.innerHTML = filtered.map(b => `
                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:15px;">
                        <div>
                            <h3 style="margin:0 0 5px 0;">${b.petName}</h3>
                            <div class="text-sm text-muted">Owner: ${b.ownerName || 'Unknown'}</div>
                        </div>
                        <span class="status-badge ${b.status}">${b.status}</span>
                    </div>
                    <div style="margin-bottom:15px; font-size: 0.95rem;">
                        <div style="margin-bottom:5px;"><strong>Date:</strong> ${b.date}</div>
                        <div style="margin-bottom:5px;"><strong>Time:</strong> ${b.time}</div>
                        <div style="margin-bottom:5px;"><strong>Type:</strong> ${b.type}</div>
                        ${b.notes ? `<div><strong>Notes:</strong> ${b.notes}</div>` : ''}
                    </div>
                    ${b.status === 'pending' ? `
                    <div style="display:flex; gap:10px; margin-top:15px; border-top:1px solid var(--border-color); padding-top:15px;">
                        <button class="btn btn-primary btn-sm" style="flex:1" onclick="updateReqStatus('${b.id}', 'approved')">Approve</button>
                        <button class="btn btn-outline text-danger btn-sm" style="flex:1" onclick="updateReqStatus('${b.id}', 'rejected')">Reject</button>
                    </div>
                    ` : ''}
                </div>
            `).join('');
        }

        window.updateReqStatus = function(id, status) {
            if (status === 'rejected') {
                showConfirmModal('Reject Request', 'Are you sure you want to reject this appointment request?', () => {
                    executeStatusUpdate(id, status);
                }, 'Yes, Reject', 'danger');
            } else {
                executeStatusUpdate(id, status);
            }
        };

        function executeStatusUpdate(id, status) {
            const bookings = VetLink.getBookings();
            const idx = bookings.findIndex(b => b.id === id);
            if (idx !== -1) {
                bookings[idx].status = status;
                VetLink.saveBookings(bookings);
                showToast(`Booking ${status}!`, status === 'approved' ? 'success' : 'info');
                renderRequests();
            }
        }
    </script>
</body>
</html>
