<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - VetLink</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="dashboard-container">
        <aside class="dashboard-sidebar">
            <div class="sidebar-header">
                <div class="logo-container">
                    <img src="assets/logo.png" alt="VetLink Logo" class="logo-img" style="height: 40px;">
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="vet-dashboard.html" class="nav-item">
                    <i data-lucide="layout-dashboard"></i><span>Dashboard</span>
                </a>
                <a href="vet-requests.html" class="nav-item">
                    <i data-lucide="bell"></i><span>Incoming Requests</span>
                </a>
                <a href="vet-patients.html" class="nav-item">
                    <i data-lucide="users"></i><span>My Patients</span>
                </a>
                <a href="vet-schedule.html" class="nav-item">
                    <i data-lucide="calendar"></i><span>Schedule</span>
                </a>
                <a href="vet-settings.html" class="nav-item active">
                    <i data-lucide="settings"></i><span>Settings</span>
                </a>
                <a href="vet-profile.html" class="nav-item">
                    <i data-lucide="user-cog"></i><span>Profile</span>
                </a>
                <a href="#" class="nav-item text-danger" id="logout-btn">
                    <i data-lucide="log-out"></i><span>Logout</span>
                </a>
            </nav>
        </aside>
        <main class="dashboard-main">
            <header class="dashboard-top-nav">
                <div class="mobile-menu-toggle" id="mobile-menu-btn">
                    <i data-lucide="menu"></i>
                </div>
                <div class="top-nav-right">
                    <div class="user-info">
                        <span id="user-name-display">Dr. Name</span>
                        <div class="avatar-sm" id="user-avatar-display">D</div>
                    </div>
                </div>
            </header>
            <div class="dashboard-content fade-in">
                <h1 class="page-header mb-20">Practice Settings</h1>
                
                <div class="card max-w-700">
                    <form id="settings-form">
                        <h2 class="section-header mb-15">Consultation & Service Fees</h2>
                        <div class="form-grid mb-20">
                            <div class="input-group">
                                <label for="baseFee">Base Consultation Fee (LKR)</label>
                                <input type="number" id="baseFee" name="baseFee" value="2000" required>
                            </div>
                            <div class="input-group">
                                <label for="transportFee">Home Visit Transport Fee (LKR)</label>
                                <input type="number" id="transportFee" name="transportFee" value="500" required>
                            </div>
                            <div class="input-group">
                                <label for="emergencyFee">Emergency Fee (LKR)</label>
                                <input type="number" id="emergencyFee" name="emergencyFee" value="1500" required>
                            </div>
                        </div>

                        <h2 class="section-header mb-15" style="margin-top:30px;">Availability Preferences</h2>
                        <div class="form-grid mb-20">
                            <div class="input-group" style="display:flex; align-items:center; gap:10px;">
                                <input type="checkbox" id="acceptClinic" name="acceptClinic" checked style="width:20px; height:20px;">
                                <label for="acceptClinic" style="margin:0;">Accept Clinic Visits</label>
                            </div>
                            <div class="input-group" style="display:flex; align-items:center; gap:10px;">
                                <input type="checkbox" id="acceptHome" name="acceptHome" checked style="width:20px; height:20px;">
                                <label for="acceptHome" style="margin:0;">Accept Home Visits</label>
                            </div>
                        </div>

                        <div class="form-actions mt-30">
                            <button type="submit" class="btn btn-primary w-full">Save Settings</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="js/notifications.js"></script>
    <script src="js/common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!VetLink.requireAuth() || !VetLink.requireRole('veterinarian')) return;
            lucide.createIcons();

            const user = VetLink.getCurrentUser();
            
            // Load existing settings if any
            if (user.settings) {
                if (user.settings.baseFee) document.getElementById('baseFee').value = user.settings.baseFee;
                if (user.settings.transportFee) document.getElementById('transportFee').value = user.settings.transportFee;
                if (user.settings.emergencyFee) document.getElementById('emergencyFee').value = user.settings.emergencyFee;
                if (user.settings.acceptClinic !== undefined) document.getElementById('acceptClinic').checked = user.settings.acceptClinic;
                if (user.settings.acceptHome !== undefined) document.getElementById('acceptHome').checked = user.settings.acceptHome;
            }

            document.getElementById('settings-form').addEventListener('submit', (e) => {
                e.preventDefault();
                
                const users = VetLink.getUsers();
                const userIdx = users.findIndex(u => u.id === user.id);
                
                if (userIdx !== -1) {
                    users[userIdx].settings = {
                        baseFee: document.getElementById('baseFee').value,
                        transportFee: document.getElementById('transportFee').value,
                        emergencyFee: document.getElementById('emergencyFee').value,
                        acceptClinic: document.getElementById('acceptClinic').checked,
                        acceptHome: document.getElementById('acceptHome').checked
                    };
                    
                    VetLink.saveUsers(users);
                    localStorage.setItem('vetlink_currentUser', JSON.stringify(users[userIdx]));
                    
                    showToast('Settings saved successfully!', 'success');
                }
            });
        });
    </script>
</body>
</html>
