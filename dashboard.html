<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - VetLink</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="dashboard-container">

        <aside class="dashboard-sidebar">
            <div class="sidebar-header">
                <div class="logo-container">
                    <img src="assets/logo.png" alt="VetLink Logo" class="logo-img" style="height: 40px;">
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item active">
                    <i data-lucide="layout-dashboard"></i><span>Dashboard</span>
                </a>
                <a href="my-pets.html" class="nav-item ">
                    <i data-lucide="dog"></i><span>My Pets</span>
                </a>
                <a href="register-pet.html" class="nav-item ">
                    <i data-lucide="plus-circle"></i><span>Register Pet</span>
                </a>
                <a href="find-vet.html" class="nav-item ">
                    <i data-lucide="search"></i><span>Find Vet</span>
                </a>
                <a href="book-vet.html" class="nav-item ">
                    <i data-lucide="calendar-plus"></i><span>Book Vet</span>
                </a>
                <a href="account.html" class="nav-item ">
                    <i data-lucide="user"></i><span>Account</span>
                </a>
                <a href="#" class="nav-item text-danger" id="logout-btn">
                    <i data-lucide="log-out"></i><span>Logout</span>
                </a>
            </nav>
        </aside>

        <main class="dashboard-main">

            <header class="dashboard-top-nav">
                <div class="mobile-menu-toggle" id="mobile-menu-btn">
                    <i data-lucide="menu"></i>
                </div>
                <div class="top-nav-right">
                    <div class="user-info">
                        <span id="user-name-display">User</span>
                        <div class="avatar-sm" id="user-avatar-display">U</div>
                    </div>
                </div>
            </header>

            <div class="dashboard-content fade-in">

                <div class="dashboard-welcome mb-20">
                    <h1 id="welcome-title">Welcome back! 👋</h1>
                    <p class="text-muted" id="welcome-subtitle">Here's what's happening with your pets today.</p>
                </div>
                
                <div class="flex gap-10 mb-20">
                    <a href="register-pet.html" class="btn btn-primary">Add New Pet</a>
                    <a href="book-vet.html" class="btn btn-outline">Book a Vet</a>
                </div>

                <div class="grid-2-1 gap-20">
                    <div class="card">
                        <div class="card-header-flex mb-15 flex items-center" style="justify-content: space-between;">
                            <h3 style="margin:0">My Pets & Recent History</h3>
                            <a href="my-pets.html" class="text-sm text-primary">View All</a>
                        </div>
                        <div id="dashboard-pets-list" class="activity-list"></div>
                    </div>
                    
                    <div class="card">
                        <h3 class="mb-15">Quick Access</h3>
                        <div class="quick-access-grid">
                            <a href="find-vet.html" class="quick-access-item text-center p-15" style="display:block; border:1px solid #eee; border-radius:8px; margin-bottom:10px; text-decoration:none;">
                                <i data-lucide="search" class="mb-10 text-primary mx-auto"></i>
                                <span>Find New Vet</span>
                            </a>
                            <a href="book-vet.html" class="quick-access-item text-center p-15" style="display:block; border:1px solid #eee; border-radius:8px; margin-bottom:10px; text-decoration:none;">
                                <i data-lucide="calendar-plus" class="mb-10 text-primary mx-auto"></i>
                                <span>Re-book Last Vet</span>
                            </a>
                            <a href="account.html" class="quick-access-item text-center p-15" style="display:block; border:1px solid #eee; border-radius:8px; text-decoration:none;">
                                <i data-lucide="user" class="mb-10 text-primary mx-auto"></i>
                                <span>My Account</span>
                            </a>
                        </div>
                    </div>
                </div>

                <div class="card mt-20">
                    <h3 class="mb-15">Last Vaccination Details</h3>
                    <div id="last-vacc-summary">
                        <p class="text-muted">Loading...</p>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="js/notifications.js"></script>
    <script src="js/common.js"></script>
    <script>

        document.addEventListener('DOMContentLoaded', () => {
            if (!VetLink.requireAuth()) return;
            if (!VetLink.requireRole('pet_owner')) return;

            const currentUser = VetLink.getCurrentUser();
            const currentUserId = currentUser.user_id || currentUser.id;
            const displayName = currentUser.name || currentUser.fullName || 'Pet Owner';
            document.getElementById('welcome-title').textContent = `Welcome back, ${displayName}! 👋`;

            const allPets = VetLink.getPets() || [];
            let userPets = allPets.filter(p => p.owner_id === currentUserId || p.ownerId === currentUserId);
            if (userPets.length === 0) userPets = allPets;

            const petsListEl = document.getElementById('dashboard-pets-list');
            if (userPets.length === 0) {
                petsListEl.innerHTML = '<p class="text-muted">No pets registered yet. Click "Add New Pet" to get started.</p>';
            } else {
                let html = '';
                userPets.slice(0, 4).forEach(pet => {
                    const records = pet.vaccination_records || pet.vaccinations || [];
                    const lastVacc = records.length > 0 
                        ? `${records[records.length - 1].used_vaccine || records[records.length - 1].vaccine || 'Vaccine'} (${records[records.length - 1].date})` 
                        : 'No records yet';
                    const petId = pet.pet_id || pet.id;
                    const species = pet.species || pet.type || 'Pet';
                    const iconName = species.toLowerCase() === 'cat' ? 'cat' : (species.toLowerCase() === 'bird' ? 'feather' : 'dog');

                    html += `
                        <div class="history-item flex items-center mb-10" style="cursor:pointer; padding:10px; border-bottom:1px solid #eee; justify-content:space-between;" onclick="window.location.href='pet-details.html?id=${petId}'">
                            <div class="flex items-center gap-10">
                                <div class="pet-avatar-sm" style="width:40px;height:40px;border-radius:50%;background:#eff6ff;color:var(--primary-color);display:flex;align-items:center;justify-content:center;"><i data-lucide="${iconName}"></i></div>
                                <div class="history-info">
                                    <h4 style="margin:0">${pet.name} <span class="status-badge text-xs" style="background:#e2e8f0; color:#334155;">${petId}</span></h4>
                                    <p class="text-xs text-muted" style="margin:2px 0 0;">${species} • ${pet.breed} • ${pet.gender || 'Pet'}</p>
                                </div>
                            </div>
                            <div class="text-xs text-muted" style="text-align:right;">
                                <div><strong>Vaccine:</strong> ${lastVacc}</div>
                                <span class="text-primary" style="font-weight:500;">View Book &rarr;</span>
                            </div>
                        </div>
                    `;
                });
                petsListEl.innerHTML = html;
                lucide.createIcons();
            }

            const vaccSummaryEl = document.getElementById('last-vacc-summary');
            let lastVaccRecord = null;
            let lastVaccPet = null;

            userPets.forEach(pet => {
                const records = pet.vaccination_records || pet.vaccinations || [];
                if (records.length > 0) {
                    const vacc = records[records.length - 1];
                    if (!lastVaccRecord || new Date(vacc.date) > new Date(lastVaccRecord.date)) {
                        lastVaccRecord = vacc;
                        lastVaccPet = pet;
                    }
                }
            });

            if (lastVaccRecord && lastVaccPet) {
                const vName = lastVaccRecord.used_vaccine || lastVaccRecord.vaccine || lastVaccRecord.name || 'Vaccine';
                const vVet = lastVaccRecord.vetName || lastVaccRecord.veterinarian || 'Veterinarian';
                vaccSummaryEl.innerHTML = `
                    <div style="background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; padding: 15px;">
                        <p style="margin: 0 0 5px; font-size: 1.05rem;">
                            <strong>${lastVaccPet.name}</strong> (${lastVaccPet.species}) received 
                            <strong style="color: #166534;">${vName}</strong> on <strong>${lastVaccRecord.date}</strong> from <strong>${vVet}</strong>.
                        </p>
                        <p class="text-sm text-muted" style="margin: 0;">
                            Status: <span class="status-badge" style="background:#dcfce7; color:#166534;">${lastVaccRecord.status || 'Verified'}</span> &bull; 
                            Next booster due: <strong>${lastVaccRecord.nextDue || 'N/A'}</strong>
                        </p>
                    </div>
                `;
            } else {
                vaccSummaryEl.innerHTML = '<p class="text-muted">No recent vaccination records found across registered pets.</p>';
            }
        });

    </script>
</body>
</html>
