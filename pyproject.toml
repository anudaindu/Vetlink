[project]
name = "vetlink"
version = "0.1.0"
description = "A veterinary care management API built with FastAPI and SQLModel"
readme = "README.md"
authors = [
    { name = "Chinthaka-Sharuna", email = "sharunadrc@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.162.0",
    "psycopg2-binary>=2.9.13",
    "pyjwt>=2.15.1",
    "sqlmodel>=0.0.48",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
