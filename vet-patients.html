<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Patients - VetLink</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="dashboard-container">
        <aside class="dashboard-sidebar">
            <div class="sidebar-header">
                <div class="logo-container">
                    <img src="assets/logo.png" alt="VetLink Logo" class="logo-img" style="height: 40px;">
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="vet-dashboard.html" class="nav-item">
                    <i data-lucide="layout-dashboard"></i><span>Dashboard</span>
                </a>
                <a href="vet-requests.html" class="nav-item">
                    <i data-lucide="bell"></i><span>Incoming Requests</span>
                </a>
                <a href="vet-patients.html" class="nav-item active">
                    <i data-lucide="users"></i><span>My Patients</span>
                </a>
                <a href="vet-schedule.html" class="nav-item">
                    <i data-lucide="calendar"></i><span>Schedule</span>
                </a>
                <a href="vet-settings.html" class="nav-item">
                    <i data-lucide="settings"></i><span>Settings</span>
                </a>
                <a href="vet-profile.html" class="nav-item">
                    <i data-lucide="user-cog"></i><span>Profile</span>
                </a>
                <a href="#" class="nav-item text-danger" id="logout-btn">
                    <i data-lucide="log-out"></i><span>Logout</span>
                </a>
            </nav>
        </aside>

        <main class="dashboard-main">
            <header class="dashboard-top-nav">
                <div class="mobile-menu-toggle" id="mobile-menu-btn">
                    <i data-lucide="menu"></i>
                </div>
                <div class="top-nav-right">
                    <div class="user-info">
                        <span id="user-name-display">Dr. Name</span>
                        <div class="avatar-sm" id="user-avatar-display">D</div>
                    </div>
                </div>
            </header>

            <div class="dashboard-content fade-in">
                <div class="mb-20 flex items-center" style="justify-content: space-between; flex-wrap: wrap; gap: 15px;">
                    <div>
                        <h1 class="page-header" style="margin: 0 0 5px;">My Patients Directory</h1>
                        <p class="text-muted" style="margin: 0;">Entity: pets &bull; Update vaccination records (update_by vet_profiles)</p>
                    </div>
                    <button id="btn-quick-record-vax" class="btn btn-primary flex items-center gap-5">
                        <i data-lucide="syringe" style="width: 16px; height: 16px;"></i> Record Vaccination
                    </button>
                </div>
                
                <!-- Filter bar with Search & Species Dropdown -->
                <div class="card mb-20">
                    <div class="grid-2 gap-15">
                        <div class="input-group" style="margin-bottom: 0;">
                            <label for="patient-search" style="font-weight: 500; font-size: 0.85rem; color: #64748b; margin-bottom: 4px; display: block;">Search Patients</label>
                            <input type="text" id="patient-search" placeholder="Search by Pet Name or Pet ID (e.g. PET-101)..." style="width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px;">
                        </div>
                        <div class="input-group" style="margin-bottom: 0;">
                            <label for="species-filter" style="font-weight: 500; font-size: 0.85rem; color: #64748b; margin-bottom: 4px; display: block;">Filter by Species (Dropdown)</label>
                            <select id="species-filter" style="width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; background-color: white;">
                                <option value="">All Species</option>
                                <!-- Populated via JS -->
                            </select>
                        </div>
                    </div>
                </div>

                <div id="patients-grid" class="grid-3 gap-15">
                    <!-- Populated by JS -->
                </div>
            </div>
        </main>
    </div>

    <!-- Modal: Record Vaccination for Patient -->
    <div id="vet-vax-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 20px;">
        <div class="card" style="width: 100%; max-width: 520px; background: white; border-radius: 12px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); max-height: 90vh; overflow-y: auto;">
            <div class="flex items-center mb-20" style="justify-content: space-between; border-bottom: 1px solid #e2e8f0; padding-bottom: 12px;">
                <h3 style="margin: 0; display: flex; align-items: center; gap: 8px;">
                    <i data-lucide="syringe" class="text-primary"></i>
                    Administer & Record Vaccination
                </h3>
                <button id="btn-close-vet-vax" style="background: none; border: none; cursor: pointer; font-size: 1.25rem; color: #64748b;">&times;</button>
            </div>

            <form id="vet-vax-form">
                <!-- Pet Select Dropdown -->
                <div class="input-group mb-15">
                    <label for="modal-pet-select" style="display: block; font-weight: 500; margin-bottom: 5px;">Select Patient (Pet Dropdown) *</label>
                    <select id="modal-pet-select" required style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; background-color: white;">
                        <option value="">-- Choose Patient --</option>
                    </select>
                </div>

                <!-- Used Vaccine Dropdown -->
                <div class="input-group mb-15">
                    <label for="modal-used-vaccine" style="display: block; font-weight: 500; margin-bottom: 5px;">Used Vaccine (Dropdown) *</label>
                    <select id="modal-used-vaccine" required style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; background-color: white;">
                        <option value="">Select Vaccine</option>
                    </select>
                </div>

                <!-- Custom Vaccine input if needed -->
                <div class="input-group mb-15" id="vet-custom-vaccine-group" style="display: none;">
                    <label for="vet-custom-vaccine" style="display: block; font-weight: 500; margin-bottom: 5px;">Specify Vaccine</label>
                    <input type="text" id="vet-custom-vaccine" placeholder="Enter vaccine details" style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px;">
                </div>

                <!-- Date -->
                <div class="form-grid grid-2 gap-15 mb-20">
                    <div class="input-group">
                        <label for="modal-vax-date" style="display: block; font-weight: 500; margin-bottom: 5px;">Administration Date *</label>
                        <input type="date" id="modal-vax-date" required style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px;">
                    </div>
                    <div class="input-group">
                        <label for="modal-next-due" style="display: block; font-weight: 500; margin-bottom: 5px;">Next Booster Due</label>
                        <input type="date" id="modal-next-due" style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px;">
                    </div>
                </div>

                <div class="flex gap-10" style="justify-content: flex-end;">
                    <button type="button" id="btn-cancel-vet-vax" class="btn btn-outline">Cancel</button>
                    <button type="submit" class="btn btn-primary">Update Vaccination Book</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/notifications.js"></script>
    <script src="js/common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!VetLink.requireAuth()) return;
            if (!VetLink.requireRole('veterinarian')) return;

            lucide.createIcons();

            // Populate Species Filter Dropdown
            const speciesFilter = document.getElementById('species-filter');
            VetLink.populateDropdown(speciesFilter, VetLink.species, '', 'All Species (Dropdown)');

            // Populate Modal Vaccine Dropdown
            const modalVaccineSelect = document.getElementById('modal-used-vaccine');
            VetLink.populateDropdown(modalVaccineSelect, VetLink.vaccineTypes, '', 'Select Vaccine');

            const searchInput = document.getElementById('patient-search');

            searchInput.addEventListener('input', () => renderPatients());
            speciesFilter.addEventListener('change', () => renderPatients());

            renderPatients();

            // Modal handling
            const modal = document.getElementById('vet-vax-modal');
            const openModalBtn = document.getElementById('btn-quick-record-vax');
            const closeModalBtn = document.getElementById('btn-close-vet-vax');
            const cancelModalBtn = document.getElementById('btn-cancel-vet-vax');
            const customGroup = document.getElementById('vet-custom-vaccine-group');
            const customInput = document.getElementById('vet-custom-vaccine');
            const petSelect = document.getElementById('modal-pet-select');

            function populatePetSelect(selectedId = '') {
                const pets = VetLink.getPets();
                petSelect.innerHTML = '<option value="">-- Choose Patient --</option>';
                pets.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.pet_id || p.id;
                    opt.textContent = `${p.name} (${p.pet_id || p.id}) - ${p.species} (${p.owner || 'Owner'})`;
                    if ((p.pet_id || p.id) === selectedId) opt.selected = true;
                    petSelect.appendChild(opt);
                });
            }

            modalVaccineSelect.addEventListener('change', () => {
                if (modalVaccineSelect.value === 'Other Vaccine') {
                    customGroup.style.display = 'block';
                    customInput.required = true;
                    customInput.focus();
                } else {
                    customGroup.style.display = 'none';
                    customInput.required = false;
                }
            });

            window.openRecordModalForPet = function(petId) {
                populatePetSelect(petId);
                document.getElementById('modal-vax-date').value = new Date().toISOString().split('T')[0];
                modal.style.display = 'flex';
                lucide.createIcons();
            };

            openModalBtn.addEventListener('click', () => {
                populatePetSelect();
                document.getElementById('modal-vax-date').value = new Date().toISOString().split('T')[0];
                modal.style.display = 'flex';
                lucide.createIcons();
            });

            function closeModal() {
                modal.style.display = 'none';
                document.getElementById('vet-vax-form').reset();
                customGroup.style.display = 'none';
            }

            closeModalBtn.addEventListener('click', closeModal);
            cancelModalBtn.addEventListener('click', closeModal);

            // Handle Save Record
            document.getElementById('vet-vax-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const petId = petSelect.value;
                if (!petId) {
                    showToast('Please select a patient.', 'warning');
                    return;
                }

                let vaxName = modalVaccineSelect.value;
                if (vaxName === 'Other Vaccine' && customInput.value.trim()) {
                    vaxName = customInput.value.trim();
                }

                const dateVal = document.getElementById('modal-vax-date').value;
                const nextDueVal = document.getElementById('modal-next-due').value;
                const currentUser = VetLink.getCurrentUser();
                const vetName = currentUser.name || currentUser.fullName || 'Veterinarian';
                const formattedVet = vetName.startsWith('Dr.') ? vetName : `Dr. ${vetName}`;

                const record = {
                    date: dateVal,
                    used_vaccine: vaxName,
                    vaccine: vaxName,
                    veterinarian: formattedVet,
                    vetName: formattedVet,
                    status: 'Verified',
                    nextDue: nextDueVal || 'N/A'
                };

                VetLink.addVaccinationRecord(petId, record);
                showToast(`Vaccination recorded for ${petId}!`, 'success');
                closeModal();
                renderPatients();
            });
        });

        function renderPatients() {
            const query = (document.getElementById('patient-search').value || '').trim().toLowerCase();
            const selectedSpecies = (document.getElementById('species-filter').value || '').trim();
            const allPets = VetLink.getPets();
            
            let patients = allPets;

            if (selectedSpecies) {
                patients = patients.filter(p => (p.species || p.type || '').toLowerCase() === selectedSpecies.toLowerCase());
            }

            if (query) {
                patients = patients.filter(p => 
                    p.name.toLowerCase().includes(query) || 
                    (p.pet_id && p.pet_id.toLowerCase().includes(query)) ||
                    (p.id && p.id.toLowerCase().includes(query)) ||
                    (p.breed && p.breed.toLowerCase().includes(query)) ||
                    (p.owner && p.owner.toLowerCase().includes(query))
                );
            }

            const container = document.getElementById('patients-grid');
            
            if (patients.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-40 text-muted">No matching patients found.</div>`;
                container.classList.remove('grid-3');
                return;
            }
            container.classList.add('grid-3');

            container.innerHTML = patients.map(p => {
                const petId = p.pet_id || p.id;
                const species = p.species || p.type || 'Pet';
                const gender = p.gender || 'Not specified';
                const dob = p.date_of_birth || p.dob;
                const age = VetLink.calculateAge(dob);
                const vaxCount = (p.vaccination_records || p.vaccinations || []).length;

                return `
                    <div class="card" style="display:flex; flex-direction:column; justify-content:space-between; gap:12px;">
                        <div>
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px;">
                                <h3 style="margin:0;">${p.name}</h3>
                                <span class="status-badge" style="background:#e0e7ff; color:#3730a3; font-weight: 600;">${petId}</span>
                            </div>
                            <div class="text-sm text-muted mb-10">Owner: <strong>${p.owner || p.ownerName || 'Pet Owner'}</strong></div>
                            
                            <div style="background: #f8fafc; border-radius: 6px; padding: 10px; font-size: 0.85rem; display: grid; grid-template-columns: 1fr 1fr; gap: 6px;">
                                <div><span class="text-muted">Species:</span> <strong>${species}</strong></div>
                                <div><span class="text-muted">Gender:</span> <strong>${gender}</strong></div>
                                <div><span class="text-muted">Breed:</span> ${p.breed || 'N/A'}</div>
                                <div><span class="text-muted">Age:</span> ${age}</div>
                            </div>

                            <div class="mt-10 text-sm">
                                <span class="text-muted">Vaccination Records:</span>
                                <strong>${vaxCount} record${vaxCount === 1 ? '' : 's'}</strong>
                            </div>
                        </div>

                        <div class="flex gap-10 mt-10">
                            <button class="btn btn-primary btn-sm flex-1 flex items-center justify-center gap-5" onclick="openRecordModalForPet('${petId}')">
                                <i data-lucide="syringe" style="width: 14px; height: 14px;"></i> Update Vaccine
                            </button>
                            <a href="pet-details.html?id=${petId}" class="btn btn-outline btn-sm flex items-center justify-center" title="Full Record">
                                <i data-lucide="file-text" style="width: 14px; height: 14px;"></i>
                            </a>
                        </div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }
    </script>
</body>
</html>
