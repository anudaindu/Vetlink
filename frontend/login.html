<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in · VetLink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/theme.js"></script>
    <script type="module" src="js/login.js"></script>
  </head>
  <body class="min-h-screen auth-bg text-slate-900">
    <div id="nav"></div>
    <main class="page-narrow">
      <section class="card">
        <img class="mx-auto mb-4 h-36 w-36" src="assets/logo.png" alt="VetLink: Connect. Care. Protect." />
        <h1 class="page-title">Log in</h1>
        <p class="page-subtitle mb-5">Welcome back.</p>
        <form class="form" id="login-form" novalidate>
          <p class="hidden" data-form-message role="alert"></p>
          <div>
            <label class="label" for="email">Email</label>
            <input class="input" id="email" name="email" type="email" autocomplete="email" />
            <p class="field-error hidden" data-error-for="email"></p>
          </div>
          <div>
            <label class="label" for="password">Password</label>
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" />
            <p class="field-error hidden" data-error-for="password"></p>
          </div>
          <button class="btn btn-full" type="submit">Log in</button>
        </form>
        <p class="mt-4 text-center text-sm text-slate-600">
          New to VetLink? <a class="text-link" href="register.html">Create an account</a>
        </p>
      </section>
    </main>
  </body>
</html>
