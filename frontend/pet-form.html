<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pet · VetLink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/theme.js"></script>
    <script type="module" src="js/pet-form.js"></script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <div id="nav"></div>
    <main class="page [&>*]:max-w-2xl">
      <h1 class="page-title" id="title">Add a pet</h1>
      <p class="notice" id="status" role="status">Loading…</p>
      <section class="card hidden">
        <form class="form" id="pet-form" novalidate>
          <p class="hidden" data-form-message role="alert"></p>
          <div class="form-grid">
            <div>
              <label class="label" for="name">Pet's name</label>
              <input class="input" id="name" name="name" type="text" maxlength="50" />
              <p class="field-error hidden" data-error-for="name"></p>
            </div>
            <div>
              <label class="label" for="species">Species</label>
              <select class="input" id="species" name="species"><option value="">Select a species</option><option value="dog">Dog</option><option value="cat">Cat</option></select>
              <p class="field-error hidden" data-error-for="species"></p>
            </div>
            <div>
              <label class="label" for="breed">Breed</label>
              <select class="input" id="breed" name="breed"></select>
              <p class="field-error hidden" data-error-for="breed"></p>
            </div>
            <div>
              <label class="label" for="gender">Gender</label>
              <select class="input" id="gender" name="gender"><option value="">Select a gender</option><option value="male">Male</option><option value="female">Female</option></select>
              <p class="field-error hidden" data-error-for="gender"></p>
            </div>
          </div>
          <fieldset>
            <legend class="label">Date of birth</legend>
            <div class="choice-group">
              <label class="choice"><input class="sr-only" type="radio" name="dob_mode" value="date" checked /> I know the birth date</label>
              <label class="choice"><input class="sr-only" type="radio" name="dob_mode" value="age" /> I only know the age</label>
            </div>
          </fieldset>
          <div id="date-pane">
            <label class="label" for="dob">Birth date</label>
            <input class="input" id="dob" name="dob" type="date" />
          </div>
          <div class="hidden" id="age-pane">
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="label" for="years">Years</label>
                <input class="input" id="years" name="years" type="number" min="0" max="40" step="1" inputmode="numeric" />
                <p class="field-error hidden" data-error-for="years"></p>
              </div>
              <div>
                <label class="label" for="months">Months</label>
                <input class="input" id="months" name="months" type="number" min="0" max="11" step="1" inputmode="numeric" />
                <p class="field-error hidden" data-error-for="months"></p>
              </div>
            </div>
            <p class="hint">We'll save an estimated birth date from this age.</p>
          </div>
          <p class="field-error hidden" data-error-for="dob"></p>
          <div class="flex gap-3 pt-2">
            <a class="btn-secondary flex-1" href="pets.html">Cancel</a>
            <button class="btn flex-1" type="submit">Add pet</button>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
